# AgriNexus AI - Plant Disease Detection Model Configuration
# Architecture: ConvNeXt-Base with Dual-Gate OOD Rejection & 61-Class Taxonomy

model:
  name: "agrinexus_disease_v2_convnext"
  backbone: "convnext_base"
  gate1_backbone: "mobilenet_v3_small"
  num_classes: 61
  image_size: 384
  drop_path_rate: 0.3
  pretrained: true
  class_mapping: "colab_trained/class_mapping.json"

ood:
  gate1_enabled: false
  gate1_leaf_threshold: 0.80
  energy_threshold: -2.0
  entropy_threshold_bits: 4.5
  confidence_threshold: 0.25

training:
  phase0_epochs: 5
  phase1_epochs: 15
  phase2_epochs: 30
  batch_size: 32
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  cutmix_prob: 0.3
  label_smoothing: 0.05
  focal_gamma: 2.0
  focal_weight: 0.4
  ce_weight: 0.6
  layer_lr_decay: 0.85
  head_lr: 0.0005
  backbone_lr: 0.00005
  weight_decay_backbone: 0.05
  weight_decay_head: 0.0001
  grad_clip_norm: 1.0
  seed: 42
  amp_dtype: "bfloat16"
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001

paths:
  data_dir: "leaf_dataset/unified"
  ood_dir: "sample images"
  checkpoint_dir: "colab_trained"
  best_model: "colab_trained/best_model.pth"
  class_mapping: "colab_trained/class_mapping.json"
