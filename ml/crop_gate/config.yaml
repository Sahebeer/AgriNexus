model:
  name: "crop_gate_efficientnet"
  backbone: "efficientnet_b0"
  num_classes: 2
  image_size: 224
  pretrained: true

thresholds:
  crop_gate_confidence: 0.85

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 4
  val_split: 0.15
  test_split: 0.15
  seed: 42

paths:
  data_dir: "ml/datasets"
  checkpoint_dir: "ml/crop_gate/checkpoints"
  best_model: "ml/crop_gate/checkpoints/best_crop_gate.pt"
